name: Bump formulas

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  simple:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        formula: [agentcfg, attention, git-worktree-sync, kb, launchd-yaml, opencode-cmd, opencode-pilot]
    steps:
      - uses: actions/checkout@v4

      - name: Discover latest upstream tag
        id: latest
        env:
          REPO: ${{ matrix.formula }}
        run: |
          tag=$(git ls-remote --tags --refs "https://github.com/athal7/$REPO" \
            | sed 's#.*refs/tags/##' \
            | sort -V | tail -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Read currently pinned tag
        id: current
        env:
          FORMULA: ${{ matrix.formula }}
        run: |
          current=$(grep -oE '/tags/v[^"]+\.tar\.gz' "Formula/$FORMULA.rb" | head -1 | sed -E 's#/tags/(.*)\.tar\.gz#\1#')
          echo "tag=$current" >> "$GITHUB_OUTPUT"

      - name: Compare tags
        id: check
        env:
          LATEST: ${{ steps.latest.outputs.tag }}
          CURRENT: ${{ steps.current.outputs.tag }}
          FORMULA: ${{ matrix.formula }}
        run: |
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "No change for $FORMULA (still $CURRENT)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$FORMULA: $CURRENT -> $LATEST"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump formula
        if: steps.check.outputs.changed == 'true'
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: ${{ matrix.formula }}
          formula-path: Formula/${{ matrix.formula }}.rb
          homebrew-tap: athal7/homebrew-tap
          tag-name: ${{ steps.latest.outputs.tag }}
          download-url: https://github.com/athal7/${{ matrix.formula }}/archive/refs/tags/${{ steps.latest.outputs.tag }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

